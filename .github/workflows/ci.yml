
name: Library LMS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  checks:
    name: Lint, Types, Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "sqlserver://localhost:1433;database=library_lms;user=ci_user;password=ci_password;encrypt=true;trustServerCertificate=true"

      - name: Check lint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build
